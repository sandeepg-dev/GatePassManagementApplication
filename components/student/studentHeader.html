<!-- 1. Top Navbar Header -->
<header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-3 flex items-center justify-between sticky top-0 z-40 shadow-xs">
  <!-- Left: GRT Logo and College Branding -->
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 flex items-center justify-center shrink-0">
      <img
        src="/public/grt-logo.png"
        onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/grt-logo.png';}else if(this.dataset.retry==='1'){this.dataset.retry=2;this.src='/assets/grt-logo.png';}"
        alt="GRT Emblem"
        class="w-9 h-9 object-contain"
      />
    </div>
    <div class="leading-tight text-left">
      <div class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">GRT INSTITUTE</div>
      <div class="text-xs font-semibold text-slate-600 tracking-wide">OF ENGINEERING AND TECHNOLOGY</div>
      <div class="text-[10px] font-mono text-slate-500 uppercase tracking-wider">TIRUTTANI &bull; AUTONOMOUS INSTITUTION</div>
    </div>
  </div>

  <!-- Center: Institutional Portal Title Badge -->
  <div class="hidden sm:flex items-center gap-2 px-3.5 py-1 bg-slate-100 border border-slate-200 rounded-full">
    <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
    <span class="text-xs font-bold text-slate-800 tracking-wider font-mono uppercase">STUDENT PORTAL</span>
  </div>

  <!-- Right: Notifications & User Profile -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      id="studentNotifBellBtn"
      onclick="toggleNotificationDrawer()"
      class="p-2 text-slate-600 hover:text-blue-600 rounded-xl hover:bg-blue-50 border border-transparent hover:border-blue-100 transition relative"
      aria-label="View notifications"
      title="Notifications"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <span id="studentNotifDot" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-blue-600 rounded-full border-2 border-white shadow-xs"></span>
    </button>

    <!-- Student Profile Pill & Dropdown -->
    <div class="relative">
      <button type="button" onclick="toggleStuProfileMenu()" class="flex items-center gap-2.5 cursor-pointer p-1.5 rounded-xl hover:bg-slate-100 transition">
        <div id="stuAvatarInitials" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">-</div>
        <div class="hidden sm:block text-left leading-tight">
          <div id="stuProfileName" class="text-xs sm:text-sm font-bold text-slate-900">-</div>
          <div id="stuProfileMeta" class="text-xs text-slate-500 font-mono">-</div>
        </div>
        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <!-- Dropdown Menu -->
      <div id="stuProfileDropdown" class="hidden absolute right-0 mt-1.5 w-44 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-50">
        <button type="button" onclick="openStudentProfileModal()" class="w-full text-left px-3.5 py-2 text-xs text-slate-700 hover:bg-slate-50 flex items-center gap-2">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span>My Profile</span>
        </button>
        <div class="border-t border-slate-100 my-1"></div>
        <button type="button" onclick="logout()" class="w-full text-left px-3.5 py-2 text-xs text-rose-600 hover:bg-rose-50 flex items-center gap-2 font-medium">
          <svg class="w-3.5 h-3.5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </div>
</header>
