<!-- ==================== LEFT-SIDE NAVIGATION MENU ==================== -->
<aside class="w-full md:w-64 lg:w-72 bg-white border-r border-slate-200 shrink-0 p-5 flex flex-col justify-between shadow-xs">
  <div class="space-y-6">
    
    <!-- Panel Header / Label -->
    <div class="px-2">
      <div class="text-[10px] font-black uppercase tracking-widest text-slate-400 font-mono">STUDENT PORTAL</div>
      <div class="text-xs font-bold text-slate-700">Official Requisitions</div>
    </div>

    <!-- Left-Side Menu (ONLY the 5 required items with large readable typography and clear spacing) -->
    <nav class="space-y-2.5" id="stuLeftNavMenu">
      
      <!-- 1. Dashboard -->
      <button
        type="button"
        id="stuNav_dashboard"
        onclick="switchStudentPage('dashboard')"
        class="stu-nav-item active group"
      >
        <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 border border-blue-100 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </div>
        <div class="flex-1 text-left leading-tight">
          <div class="text-[15px] font-bold text-slate-800 group-hover:text-blue-700">Dashboard</div>
          <div class="text-[11px] text-slate-400 font-medium">Overview &amp; Alerts</div>
        </div>
      </button>

      <!-- 2. Gate Pass Request -->
      <button
        type="button"
        id="stuNav_pass"
        onclick="openGatePassRequestModal()"
        class="stu-nav-item group"
      >
        <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 border border-blue-100 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
        </div>
        <div class="flex-1 text-left leading-tight">
          <div class="text-[15px] font-bold text-slate-800 group-hover:text-blue-700">Gate Pass Request</div>
          <div class="text-[11px] text-slate-400 font-medium">Campus Outpass</div>
        </div>
        <span class="w-6 h-6 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xs group-hover:translate-x-0.5 transition-transform font-bold">+</span>
      </button>

      <!-- 3. Leave Request -->
      <button
        type="button"
        id="stuNav_leave"
        onclick="openLeaveRequestModal()"
        class="stu-nav-item group"
      >
        <div class="w-9 h-9 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center shrink-0 border border-purple-100 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div class="flex-1 text-left leading-tight">
          <div class="text-[15px] font-bold text-slate-800 group-hover:text-purple-700">Leave Request</div>
          <div class="text-[11px] text-slate-400 font-medium">Formal Absence</div>
        </div>
        <span class="w-6 h-6 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center text-xs group-hover:translate-x-0.5 transition-transform font-bold">+</span>
      </button>

      <!-- 4. OD Request -->
      <button
        type="button"
        id="stuNav_onduty"
        onclick="openODRequestModal()"
        class="stu-nav-item group"
      >
        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 border border-emerald-100 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <div class="flex-1 text-left leading-tight">
          <div class="text-[15px] font-bold text-slate-800 group-hover:text-emerald-700">OD Request</div>
          <div class="text-[11px] text-slate-400 font-medium">Academic On-Duty</div>
        </div>
        <span class="w-6 h-6 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs group-hover:translate-x-0.5 transition-transform font-bold">+</span>
      </button>

      <!-- 5. My Requests / Request Status -->
      <button
        type="button"
        id="stuNav_requests"
        onclick="switchStudentPage('requests')"
        class="stu-nav-item group"
      >
        <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0 border border-amber-100 group-hover:scale-105 transition-transform">
          <svg class="w-4 h-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
        </div>
        <div class="flex-1 text-left leading-tight">
          <div class="text-[15px] font-bold text-slate-800 group-hover:text-amber-700">My Requests</div>
          <div class="text-[11px] text-slate-400 font-medium">Status &amp; Approvals</div>
        </div>
        <span id="navReqBadge" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 border border-slate-200 font-mono">0</span>
      </button>

    </nav>
  </div>

  <!-- Bottom Profile Card in Left Sidebar -->
  <div class="pt-5 mt-6 border-t border-slate-100">
    <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 font-mono">STUDENT RECORD</span>
        <span id="sidebarAccomBadge" class="px-2 py-0.5 text-[9px] font-bold rounded-md bg-blue-50 text-blue-700 border border-blue-200">-</span>
      </div>
      <div class="text-xs font-bold text-slate-900 truncate" id="sidebarStudentName">-</div>
      <div class="text-[11px] text-slate-500 font-mono" id="sidebarStudentRoll">-</div>
      <button
        type="button"
        onclick="openStudentProfileModal()"
        class="w-full mt-1 px-2.5 py-1.5 bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold rounded-lg text-center transition flex items-center justify-center gap-1.5"
      >
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>View Profile</span>
      </button>
    </div>
  </div>
</aside>
