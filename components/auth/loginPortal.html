<!-- SCREEN 1: MINIMAL & PROFESSIONAL INSTITUTIONAL LOGIN PORTAL -->
<main id="singleLoginPortalScreen" class="max-w-sm sm:max-w-md w-full mx-auto my-auto py-10 px-4 z-10 transition-all duration-300">
  <div id="loginCard" class="bg-white/95 backdrop-blur-md border border-slate-200/90 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6 relative overflow-hidden transition-all duration-300">
    
    <!-- Top Section: GRT Logo and Campus PassPro ONLY -->
    <div class="text-center space-y-3">
      <!-- GRT Logo -->
      <div class="w-14 h-14 mx-auto rounded-xl bg-white p-2 shadow-xs border border-slate-200 flex items-center justify-center shrink-0">
        <img
          src="/public/grt-logo.png"
          onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/grt-logo.png';}else if(this.dataset.retry==='1'){this.dataset.retry=2;this.src='/assets/grt-logo.png';}"
          alt="GRT Logo"
          class="w-full h-full object-contain"
        >
      </div>

      <!-- Campus PassPro Title -->
      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900">
        Campus PassPro
      </h1>
    </div>

    <!-- Error Alert Box (Only shown if authentication fails) -->
    <div
      id="loginErrorAlert"
      class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold leading-relaxed text-center"
    ></div>

    <!-- Login Form: Login ID, Password, SIGN IN -->
    <form id="commonLoginForm" autocomplete="off" onsubmit="event.preventDefault(); handleCommonLogin(event);" class="space-y-4">
      <!-- Login ID -->
      <div>
        <label for="commonLoginId" class="block text-xs font-bold text-slate-700 mb-1.5">
          Login ID
        </label>
        <div class="relative">
          <input
            type="text"
            id="commonLoginId"
            required
            placeholder="Enter Login ID"
            autocomplete="username"
            class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition font-mono shadow-2xs"
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="commonPassword" class="block text-xs font-bold text-slate-700 mb-1.5">
          Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="commonPassword"
            required
            placeholder="Enter Password"
            autocomplete="current-password"
            class="w-full pl-3.5 pr-10 py-2.5 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition shadow-2xs"
          >
          <button
            type="button"
            onclick="togglePasswordVisibility('commonPassword', 'passwordEyeIcon')"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700 transition"
            title="Toggle password visibility"
            tabindex="-1"
          >
            <span id="passwordEyeIcon">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- SIGN IN button with subtle professional animation -->
      <button
        type="submit"
        id="commonLoginBtn"
        class="login-btn w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold rounded-xl text-sm shadow-sm transition active:scale-[0.99] flex items-center justify-center gap-2 mt-4 cursor-pointer relative overflow-hidden"
      >
        <span id="loginBtnContent" class="flex items-center justify-center gap-2">
          <span>SIGN IN</span>
        </span>
      </button>
    </form>
  </div>
</main>
