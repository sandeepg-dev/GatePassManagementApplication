<!-- POPUP MODAL 2: LEAVE REQUEST -->
<div id="modalLeaveRequest" class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto modal-backdrop-animate">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 sm:p-7 space-y-5 modal-content-animate my-auto max-h-[92vh] overflow-y-auto">
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-3.5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center border border-purple-100 shrink-0">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">Leave Request</h2>
          <p class="text-xs text-slate-500">Official academic leave requisition</p>
        </div>
      </div>
      <button
        type="button"
        onclick="closeLeaveRequestModal()"
        class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition"
        aria-label="Close dialog"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Verified Student Profile Information Banner -->
    <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-[11px] font-bold text-slate-800 uppercase tracking-wider font-mono">Student Profile</span>
        </div>
        <span class="text-[10px] text-slate-400 font-medium">Auto-retrieved from record</span>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs pt-0.5">
        <div>
          <span class="text-[10px] text-slate-400 block font-medium">Student Name</span>
          <span id="leaveModalStudentName" class="font-bold text-slate-900 truncate block">-</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 block font-medium">Registration No</span>
          <span id="leaveModalRegNo" class="font-bold font-mono text-slate-900 block">-</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 block font-medium">Department &amp; Year</span>
          <span id="leaveModalDeptYear" class="font-semibold text-slate-800 truncate block">-</span>
        </div>
      </div>
    </div>

    <!-- Leave Request Form Inputs (Student enters ONLY the 3 required fields) -->
    <div class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Leave From Date <span class="text-rose-500">*</span></label>
          <input type="date" id="leaveFromDate" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-800 focus:outline-none focus:border-purple-600 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Leave To Date <span class="text-rose-500">*</span></label>
          <input type="date" id="leaveToDate" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-800 focus:outline-none focus:border-purple-600 transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Reason <span class="text-rose-500">*</span></label>
        <textarea id="leaveReason" rows="3" placeholder="Enter reason for leave..." class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-800 focus:outline-none focus:border-purple-600 transition"></textarea>
      </div>

      <!-- Hidden compatibility elements -->
      <div class="hidden" aria-hidden="true">
        <input type="text" id="leaveExtraNotes" />
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="flex items-center justify-end gap-3 pt-3.5 border-t border-slate-100">
      <button type="button" onclick="closeLeaveRequestModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
        Cancel
      </button>
      <button type="button" onclick="submitPopupLeaveRequest()" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold transition shadow-xs flex items-center gap-2 active:scale-95">
        <span>Submit Request</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </div>
  </div>
</div>
