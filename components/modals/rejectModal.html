<!-- REJECTION REASON MODAL -->
<div id="rejectModal" class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto modal-backdrop-animate">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-7 max-w-md w-full shadow-2xl text-slate-800 space-y-4 modal-content-animate my-auto">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center border border-rose-200">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </div>
        <h3 id="rejectModalTitle" class="text-base font-bold text-slate-900">Reject Application</h3>
      </div>
      <button onclick="closeRejectModal()" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition" aria-label="Close dialog">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">Select or type the official institutional reason for rejecting this requisition.</p>

    <!-- Preset Reason Chips -->
    <div id="presetChipsContainer" class="flex flex-wrap gap-1.5">
      <button type="button" onclick="setRejectReason('Parent disclaimed permission during verification call')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 rounded-lg text-xs font-semibold text-slate-700 border border-slate-200 transition">
        Parent Disclaimed
      </button>
      <button type="button" onclick="setRejectReason('Inadequate academic attendance (<75%)')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 rounded-lg text-xs font-semibold text-slate-700 border border-slate-200 transition">
        Inadequate Attendance
      </button>
      <button type="button" onclick="setRejectReason('Scheduled internal examination / lab assessment')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 rounded-lg text-xs font-semibold text-slate-700 border border-slate-200 transition">
        Exam Scheduled
      </button>
      <button type="button" onclick="setRejectReason('Disciplinary hold by department authority')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 rounded-lg text-xs font-semibold text-slate-700 border border-slate-200 transition">
        Disciplinary Hold
      </button>
    </div>

    <input type="hidden" id="rejectPassId" value="" />
    <input type="hidden" id="rejectRoleLabel" value="" />
    <input type="hidden" id="rejectIsOD" value="false" />
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider font-mono">
        Official Rejection Statement <span class="text-rose-500">*</span>
      </label>
      <textarea
        id="rejectReasonInput"
        rows="3"
        placeholder="State reason clearly..."
        class="w-full p-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-100 transition shadow-2xs"
      ></textarea>
    </div>
    <div class="flex justify-end gap-2.5 pt-2 border-t border-slate-100">
      <button onclick="closeRejectModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-xl text-sm font-bold transition">
        Cancel
      </button>
      <button onclick="submitRejectPass()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white rounded-xl text-sm font-bold shadow-xs transition">
        Confirm Rejection
      </button>
    </div>
  </div>
</div>
